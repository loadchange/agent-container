name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-contract:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          /bin/bash -n \
            agent-container \
            claude-container \
            codex-container \
            grok-container \
            entrypoint.sh \
            install.sh \
            uninstall.sh \
            tests/test-agent-container.sh \
            tests/test-install-uninstall.sh \
            tests/fixtures/* \
            tests/install-fixtures/*

      - name: Validate profiles and executable modes
        run: |
          ./agent-container profiles
          test -x agent-container
          test -x claude-container
          test -x codex-container
          test -x grok-container
          test -x entrypoint.sh
          test -x install.sh
          test -x uninstall.sh
          test -x tests/test-agent-container.sh
          test -x tests/test-install-uninstall.sh

      - name: Verify release manifest
        run: |
          shasum -a 256 \
            agent-container \
            claude-container \
            codex-container \
            grok-container \
            Containerfile \
            Containerfile.dockerignore \
            entrypoint.sh \
            profiles/claude.json \
            profiles/codex.json \
            profiles/grok.json \
            | cmp - release-manifest.sha256

      - name: Run generic runtime contract tests
        run: tests/test-agent-container.sh

      - name: Run install and uninstall transaction tests
        run: tests/test-install-uninstall.sh

      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check \
            4b825dc642cb6eb9a060e54bf8d69288fbee4904 \
            HEAD
