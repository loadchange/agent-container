name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  macos-contract:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: clippy, rustfmt

      - name: Validate Rust sources
        run: |
          cargo fmt --all -- --check
          cargo test --locked --offline
          cargo clippy --locked --offline --all-targets -- -D warnings

      - name: Build the reproducible release
        shell: bash
        run: |
          set -euo pipefail

          [ "$(uname -m)" = arm64 ] || {
            echo "macos-contract requires an arm64 runner" >&2
            exit 1
          }

          # Two isolated builds, each stripped and ad-hoc signed, must agree
          # byte for byte. The native launcher is published through GitHub
          # Releases; it is not tracked in git. The tarball is packed here so
          # pull requests can publish it as a downloadable beta artifact.
          scripts/build-release.sh --tarball

      - name: Validate Bash syntax
        run: |
          /bin/bash -n \
            install.sh \
            uninstall.sh \
            bin/agent-container \
            bin/claude-container \
            bin/codex-container \
            bin/grok-container \
            runtime/agent-container-runtime \
            runtime/agent-workspace-connect \
            runtime/agent-workspace-session \
            runtime/entrypoint.sh \
            runtime/host-exec-client \
            scripts/build-release.sh \
            scripts/generate-manifest.sh \
            tests/test-agent-container.sh \
            tests/test-host-exec.sh \
            tests/test-install-uninstall.sh \
            tests/test-workspace-bridge.sh \
            tests/test-workspace-session-live.sh \
            tests/fixtures/container \
            tests/fixtures/curl \
            tests/fixtures/host-exec-broker \
            tests/fixtures/openssl \
            tests/fixtures/security \
            tests/fixtures/sw_vers \
            tests/fixtures/sysctl \
            tests/fixtures/uname \
            tests/install-fixtures/*

      - name: Validate host broker syntax
        run: node --check runtime/host-exec-broker.mjs

      - name: Validate Homebrew formula syntax
        run: ruby -c Formula/agent-container.rb

      - name: Validate profiles and executable modes
        run: |
          dist/agent-container-darwin-arm64 profiles
          for executable in \
            install.sh \
            uninstall.sh \
            bin/agent-container \
            bin/claude-container \
            bin/codex-container \
            bin/grok-container \
            runtime/agent-container-runtime \
            runtime/agent-workspace-connect \
            runtime/agent-workspace-session \
            runtime/entrypoint.sh \
            runtime/host-exec-client \
            scripts/build-release.sh \
            scripts/generate-manifest.sh \
            dist/agent-container-darwin-arm64 \
            dist/agent-container-runtime \
            dist/entrypoint.sh \
            dist/host-exec-client \
            dist/agent-workspace-connect \
            dist/agent-workspace-session \
            tests/test-agent-container.sh \
            tests/test-host-exec.sh \
            tests/test-install-uninstall.sh \
            tests/test-workspace-bridge.sh \
            tests/test-workspace-session-live.sh \
            tests/install-fixtures/*; do
            test -x "$executable"
          done
          test -f tests/fixtures/workspace-bridge-peer.rs
          test -x tests/fixtures/workspace-session-test-agent

      - name: Verify release manifest
        run: scripts/generate-manifest.sh --check

      - name: Run workspace bridge security tests
        run: tests/test-workspace-bridge.sh

      - name: Run generic runtime contract tests
        run: tests/test-agent-container.sh

      - name: Run host executor contract tests
        run: tests/test-host-exec.sh

      - name: Run install and uninstall transaction tests
        run: tests/test-install-uninstall.sh

      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check \
            4b825dc642cb6eb9a060e54bf8d69288fbee4904 \
            HEAD

      # Runs last so only a fully validated build is published. The tarball
      # preserves executable modes (the artifact zip itself does not), and
      # main pushes are excluded because they publish real releases instead.
      - name: Publish the pull-request beta artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-container-darwin-arm64-beta
          path: |
            dist/agent-container-darwin-arm64.tar.gz
            dist/release-manifest.sha256
          if-no-files-found: error
